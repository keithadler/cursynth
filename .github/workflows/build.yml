name: build

on:
  push:
    branches: [ main, master, revive ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-latest }
          - { name: macos,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # autopoint is its own package on Debian and Ubuntu, and autoreconf
          # cannot bootstrap a project that uses gettext without it.
          # sord_validate is what actually checks the plugin's description;
          # on Debian and Ubuntu it comes from sordi, not from the LV2 package.
          sudo apt-get install -y automake autoconf autopoint pkg-config \
            gettext libncurses-dev libasound2-dev lv2-dev texinfo sordi

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        # lv2_validate is a shell script that calls sord_validate, which comes
        # from a different package, so asking for one without the other gives
        # a command that exists and cannot run.
        run: brew install automake autoconf pkg-config gettext lv2 sord texinfo

      # This is the build a person actually types. It used to need a gettext
      # dance and a texinfo install before it would get anywhere.
      - name: Build the way the README says
        run: |
          autoreconf -i
          ./configure
          make -j2

      - name: Test
        run: |
          # Show the suite's own log when it exists; a build failure means
          # there is no log to show and cat should not hide the real error.
          if ! make check; then
            [ -f tests/test-suite.log ] && cat tests/test-suite.log
            exit 1
          fi

      # A check that quietly does nothing and reports success is worse than no
      # check, so this refuses to skip. lv2_validate is only a wrapper that
      # hands sord_validate the installed LV2 spec along with your files, and
      # Ubuntu ships one without the other, so fall back to doing that by hand.
      - name: The plugin describes itself correctly
        run: |
          set -e
          if command -v lv2_validate >/dev/null 2>&1 && \
             command -v sord_validate >/dev/null 2>&1; then
            echo "using lv2_validate"
            lv2_validate lv2/cursynth.lv2/*.ttl
          elif command -v sord_validate >/dev/null 2>&1; then
            echo "using sord_validate against the installed LV2 spec"
            # lv2.pc names the spec directory itself; the usual places are
            # only a fallback for a package that does not say.
            LV2DIR=$(pkg-config --variable=lv2dir lv2 || true)
            for d in "$LV2DIR" /usr/lib/lv2 /usr/local/lib/lv2; do
              if [ -n "$d" ] && [ -d "$d" ]; then LV2DIR="$d"; break; fi
            done
            echo "LV2 spec in $LV2DIR"
            SPEC=$(find "$LV2DIR" -name '*.ttl' | sort)
            # No spec means sord_validate would check our files against
            # nothing at all and call almost everything undefined, so the
            # number of files found is itself worth asserting.
            echo "$SPEC" | wc -l
            test "$(echo "$SPEC" | wc -l)" -gt 20
            sord_validate $SPEC lv2/cursynth.lv2/*.ttl
          else
            echo "no validator available; this check cannot be skipped" >&2
            exit 1
          fi

      - name: It installs
        run: |
          make install DESTDIR=$PWD/staging
          find staging -type f | sort

  # The two things that stopped people building cursynth for a decade were a
  # missing gettext and a missing texinfo. Neither should matter now, so the
  # build is done again with both refused.
  without-the-extras:
    name: no gettext, no texinfo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies, deliberately incomplete
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf autopoint pkg-config \
            gettext libncurses-dev libasound2-dev
      - name: Build with translation turned off and no manual tool
        run: |
          autoreconf -i
          ./configure --disable-nls
          make -j2
          ./src/cursynth --version
